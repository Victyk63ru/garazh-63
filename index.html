const COLORS = {
  orange: "#DF7632",
  ink: "#1E1B1E",
  graphite: "#141215",
  plywood: "#F2E0C6",
  bg: "#F7F5F2",
  gray: "#8A8177",
  cardBorder: "#E7DFD2",
};

function Ico({ name, size = 24, style }) {
  return <img src={ICONS[name]} alt="" style={{ width: size, height: size, objectFit: "contain", display: "block", ...style }} />;
}

function Hexagon({ children, size = 56 }) {
  return (
    <div
      style={{
        width: size, height: size * 0.87, background: COLORS.plywood,
        border: `2px solid ${COLORS.ink}`,
        clipPath: "polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%)",
      }}
      className="flex items-center justify-center flex-shrink-0"
    >{children}</div>
  );
}
function CircleIcon({ children, size = 56, bg }) {
  return (
    <div style={{ width: size, height: size, background: bg || COLORS.plywood, border: `2px solid ${COLORS.ink}` }}
      className="rounded-full flex items-center justify-center flex-shrink-0">{children}</div>
  );
}
function SquareIcon({ children, size = 56, bg }) {
  return (
    <div style={{ width: size, height: size, background: bg || COLORS.plywood, border: `2px solid ${COLORS.ink}` }}
      className="rounded-2xl flex items-center justify-center flex-shrink-0">{children}</div>
  );
}
function ProgressBar({ value, track }) {
  return (
    <div style={{ background: track || "#E7DFD2", height: 8 }} className="w-full rounded-full overflow-hidden">
      <div style={{ background: COLORS.orange, width: `${Math.min(100, value)}%`, height: "100%", transition: "width 0.4s ease" }} className="rounded-full" />
    </div>
  );
}

function Chrome({ title, onBack, right, showStatus = true }) {
  return (
    <div style={{ background: COLORS.graphite }}>
      {showStatus && (
        <div className="flex justify-between items-center px-6 pt-2 pb-1 text-[11px] font-bold" style={{ color: "white" }}>
          <span>9:41</span><span>●●●  📶  🔋</span>
        </div>
      )}
      <div className="flex items-center justify-between px-4 pb-3 pt-1">
        <div className="flex items-center gap-2 min-w-0">
          {onBack && (
            <button onClick={onBack} className="p-1 -ml-1 flex-shrink-0">
              <ChevronLeft size={22} color="white" />
            </button>
          )}
          <span className="font-bold text-lg truncate" style={{ color: "white" }}>{title}</span>
        </div>
        {right}
      </div>
    </div>
  );
}

function BottomNav({ items, active, onChange }) {
  return (
    <div className="flex items-center justify-around px-2 pb-2 pt-2" style={{ background: COLORS.graphite }}>
      {items.map((it) => {
        const isActive = it.key === active;
        return (
          <button key={it.key} onClick={() => onChange(it.key)} className="flex flex-col items-center gap-0.5 px-2 py-1">
            <div className="rounded-full flex items-center justify-center"
              style={{ width: 32, height: 32, background: isActive ? COLORS.orange : "transparent" }}>
              <Ico name={it.icon} size={18} style={isActive ? { filter: "brightness(0) invert(1)" } : { filter: "brightness(0) invert(1)", opacity: 0.55 }} />
            </div>
            <span className="text-[10px]" style={{ color: isActive ? COLORS.orange : "rgba(255,255,255,0.55)", fontWeight: isActive ? 700 : 400 }}>{it.label}</span>
          </button>
        );
      })}
    </div>
  );
}

function Card({ children, onClick, style }) {
  const Tag = onClick ? "button" : "div";
  return (
    <Tag onClick={onClick} className="w-full text-left rounded-2xl p-4" style={{ background: "white", border: `1px solid ${COLORS.cardBorder}`, ...style }}>
      {children}
    </Tag>
  );
}

];

function useNav(initial) {
  const [stack, setStack] = useState([{ screen: initial, params: {} }]);
  return {
    current: stack[stack.length - 1],
    stack,
    push: (screen, params = {}) => setStack((s) => [...s, { screen, params }]),
    pop: () => setStack((s) => (s.length > 1 ? s.slice(0, -1) : s)),
    replace: (screen, params = {}) => setStack((s) => [...s.slice(0, -1), { screen, params }]),
    reset: (screen, params = {}) => setStack([{ screen, params }]),
  };
}

function GarazhPrototype() {
  const [role, setRole] = useState("child");
  const childNav = useNav("child_home");
  const adultNav = useNav("adult_home");

  const [taskDone, setTaskDone] = useState({ t1: true, t2: false, t3: false });
  const [projectProgress, setProjectProgress] = useState(70);
  const [incidentResolved, setIncidentResolved] = useState(false);

  function completeTask(taskId) {
    setTaskDone((d) => ({ ...d, [taskId]: true }));
    setProjectProgress((p) => Math.min(100, p + (taskId === "t3" ? 10 : 15)));
    const unlocksAchievement = taskId === "t3";
    if (unlocksAchievement) setIncidentResolved(true);
    childNav.replace("child_task_success", { achievement: unlocksAchievement });
  }

  function switchRole(r) {
    setRole(r);
  }

  const nav = role === "child" ? childNav : adultNav;
  const { screen, params } = nav.current;

  let content;
  if (role === "child") {
    if (screen === "child_home") content = <ChildHome nav={childNav} taskDone={taskDone} />;
    else if (screen === "child_tasks") content = <ChildTasks nav={childNav} taskDone={taskDone} />;
    else if (screen === "child_task_detail") content = <ChildTaskDetail nav={childNav} params={params} onComplete={completeTask} />;
    else if (screen === "child_task_success") content = <ChildTaskSuccess nav={childNav} params={params} />;
    else if (screen === "child_achievements") content = <ChildAchievements nav={childNav} incidentResolved={incidentResolved} />;
    else if (screen === "child_progress") content = <ChildProgress nav={childNav} projectProgress={projectProgress} />;
    else if (screen === "child_schedule") content = <ChildSchedule nav={childNav} />;
    else if (screen === "child_media") content = <ChildMedia nav={childNav} />;
    else if (screen === "child_news") content = <NewsFeed nav={childNav} />;
    else if (screen === "child_profile") content = <ChildProfile nav={childNav} projectProgress={projectProgress} />;
    else content = <ChildHome nav={childNav} taskDone={taskDone} />;
  } else {
    if (screen === "adult_home") content = <AdultHome nav={adultNav} />;
    else if (screen === "adult_child") content = <AdultChild nav={adultNav} projectProgress={projectProgress} incidentResolved={incidentResolved} />;
    else content = <AdultHome nav={adultNav} />;
  }

  const showBottomNav = role === "child" && screen !== "child_task_success";

  return (
    <div className="min-h-screen flex flex-col items-center justify-center py-8 gap-4" style={{ background: "#2A2620" }}>
      <div className="flex gap-1 p-1 rounded-full" style={{ background: "white", border: `1px solid ${COLORS.cardBorder}` }}>
        {[["child", "Ребёнок"], ["adult", "Взрослый / Наблюдатель"]].map(([key, label]) => (
          <button
            key={key}
            onClick={() => switchRole(key)}
            className="px-4 py-1.5 rounded-full text-xs font-bold"
            style={{ background: role === key ? COLORS.orange : "transparent", color: role === key ? "white" : COLORS.ink }}
          >
            {label}
          </button>
        ))}
      </div>

      <div
        className="rounded-[2.5rem] overflow-hidden flex flex-col"
        style={{ width: 360, height: 720, background: COLORS.bg, border: `8px solid ${COLORS.graphite}`, boxShadow: "0 20px 50px rgba(0,0,0,0.4)" }}
      >
        {screen !== "child_task_success" && (
          <div className="flex justify-between items-center px-6 pt-2 pb-1 text-[11px] font-bold" style={{ color: COLORS.ink, background: COLORS.bg }}>
            <span>9:41</span><span>●●●  📶  🔋</span>
          </div>
        )}
        {content}
        {showBottomNav && <BottomNav items={CHILD_NAV} active={screen === "child_task_detail" || screen === "child_task_success" ? "child_tasks" : screen} onChange={(k) => childNav.reset(k)} />}
        {role === "adult" && (
          <div className="flex items-center justify-center px-4 py-3" style={{ background: COLORS.graphite }}>
            <span className="text-xs" style={{ color: "rgba(255,255,255,0.5)" }}>Режим наблюдателя · только просмотр</span>
          </div>
        )}
      </div>
    </div>
  );
}
